<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>此电脑</title>
    <link rel="stylesheet" href="/StaticResources/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff;
            color: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 工具栏 */
        .toolbar {
            display: flex;
            padding: 5px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #d9d9d9;
            gap: 10px;
        }

        .toolbar-group {
            display: flex;
            gap: 2px;
            padding: 0 5px;
            border-right: 1px solid #d9d9d9;
        }

        .toolbar-group:last-child {
            border-right: none;
        }

        .toolbar-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3px 8px;
            min-width: 50px;
            cursor: default;
        }

        .toolbar-button:hover {
            background-color: #e5f1fb;
        }

        .toolbar-button:active {
            background-color: #cce4f7;
        }

        .toolbar-button.disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .toolbar-button img {
            width: 24px;
            height: 24px;
            margin-bottom: 2px;
        }

        .toolbar-button span {
            font-size: 11px;
        }

        /* 地址栏 */
        .address-bar {
            display: flex;
            align-items: center;
            padding: 5px 10px;
            background-color: #fff;
            border-bottom: 1px solid #d9d9d9;
            gap: 10px;
        }

        .nav-buttons {
            display: flex;
            gap: 2px;
        }

        .nav-button {
            width: 28px;
            height: 28px;
            border: 1px solid transparent;
            background: none;
            cursor: default;
            font-size: 16px;
            line-height: 1;
        }

        .nav-button:hover {
            background-color: #e5f1fb;
            border-color: #0078d4;
        }

        .nav-button:active {
            background-color: #cce4f7;
        }

        .nav-button.disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .address-input-container {
            flex: 1;
            display: flex;
            align-items: center;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 2px 5px;
        }

        .address-input-container:focus-within {
            border-color: #0078d4;
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.3);
        }

        .address-icon {
            width: 20px;
            height: 20px;
            margin-right: 5px;
        }

        .address-input {
            flex: 1;
            border: none;
            outline: none;
            height: 28px;
            font-size: 13px;
            background: transparent;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: #fff;
            border: 1px solid #ccc;
            padding: 2px 5px;
            width: 250px;
        }

        .search-box:focus-within {
            border-color: #0078d4;
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.3);
        }

        .search-icon {
            width: 16px;
            height: 16px;
            margin-right: 5px;
            opacity: 0.5;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            height: 26px;
            font-size: 13px;
            background: transparent;
        }

        /* 主内容区 */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
            background-color: #fff;
        }

        /* 导航侧边栏 */
        .navigation-pane {
            width: 200px;
            background-color: #f5f5f5;
            border-right: 1px solid #d9d9d9;
            padding: 10px 0;
            overflow-y: auto;
        }

        .nav-section {
            margin-bottom: 15px;
        }

        .nav-section-title {
            padding: 5px 15px;
            font-size: 12px;
            font-weight: bold;
            color: #666;
            text-transform: uppercase;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 6px 15px;
            gap: 10px;
            cursor: default;
            font-size: 13px;
        }

        .nav-item:hover {
            background-color: #e5f1fb;
        }

        .nav-item.active {
            background-color: #cce4f7;
        }

        .nav-item img {
            width: 20px;
            height: 20px;
        }

        .nav-item span {
            flex: 1;
        }

        /* 文件列表 */
        .file-list {
            flex: 1;
            overflow-y: auto;
            background-color: #fff;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
            padding: 10px;
        }

        .file-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
            cursor: default;
            text-align: center;
        }

        .file-item:hover {
            background-color: #e5f1fb;
        }

        .file-item.selected {
            background-color: #cce4f7;
            outline: 1px solid #0078d4;
        }

        .file-item img {
            width: 48px;
            height: 48px;
            margin-bottom: 5px;
        }

        .file-item .file-name {
            font-size: 12px;
            word-break: break-word;
            max-width: 100%;
        }

        .file-item .file-size {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        .file-item .file-date {
            font-size: 11px;
            color: #666;
        }

        /* 列表视图 */
        .file-list-view {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .file-list-view th {
            text-align: left;
            padding: 8px 10px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #d9d9d9;
            font-weight: normal;
            cursor: default;
        }

        .file-list-view th:hover {
            background-color: #e5f1fb;
        }

        .file-list-view td {
            padding: 6px 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .file-list-view tr:hover td {
            background-color: #e5f1fb;
        }

        .file-list-view tr.selected td {
            background-color: #cce4f7;
        }

        .file-list-view .file-icon {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 8px;
        }

        /* 状态栏 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            padding: 3px 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #d9d9d9;
            font-size: 12px;
        }

        .status-left,
        .status-right {
            display: flex;
            gap: 20px;
        }

        /* 视图切换 */
        .view-toggle {
            display: flex;
            gap: 2px;
            margin-left: auto;
        }

        .view-toggle button {
            width: 30px;
            height: 30px;
            border: 1px solid transparent;
            background: none;
            cursor: default;
            font-size: 16px;
        }

        .view-toggle button:hover {
            background-color: #e5f1fb;
            border-color: #0078d4;
        }

        .view-toggle button.active {
            background-color: #cce4f7;
            border-color: #0078d4;
        }

        /* 隐藏元素 */
        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <!-- 工具栏 -->
    <div class="toolbar">
        <div class="toolbar-group">
            <div class="toolbar-button" id="back-button">
                <img src="../../StaticResources/Icons/back.png" alt="后退">
                <span>后退</span>
            </div>
            <div class="toolbar-button" id="forward-button">
                <img src="../../StaticResources/Icons/forward.png" alt="前进">
                <span>前进</span>
            </div>
            <div class="toolbar-button" id="up-button">
                <img src="../../StaticResources/Icons/up.png" alt="向上">
                <span>向上</span>
            </div>
        </div>
        <div class="toolbar-group">
            <div class="toolbar-button" id="refresh-button">
                <img src="../../StaticResources/Icons/refresh.png" alt="刷新">
                <span>刷新</span>
            </div>
        </div>
        <div class="toolbar-group">
            <div class="toolbar-button" id="new-folder-button">
                <img src="../../StaticResources/Icons/new-folder.ico" alt="新建文件夹">
                <span>新建文件夹</span>
            </div>
            <div class="toolbar-button" id="cut-button">
                <img src="../../StaticResources/Icons/cut.png" alt="剪切">
                <span>剪切</span>
            </div>
            <div class="toolbar-button" id="copy-button">
                <img src="../../StaticResources/Icons/copy.png" alt="复制">
                <span>复制</span>
            </div>
            <div class="toolbar-button" id="paste-button">
                <img src="../../StaticResources/Icons/paste.png" alt="粘贴">
                <span>粘贴</span>
            </div>
            <div class="toolbar-button" id="delete-button">
                <img src="../../StaticResources/Icons/delete.png" alt="删除">
                <span>删除</span>
            </div>
            <div class="toolbar-button" id="rename-button">
                <img src="../../StaticResources/Icons/rename.png" alt="重命名">
                <span>重命名</span>
            </div>
        </div>
        <div class="toolbar-group">
            <div class="toolbar-button" id="properties-button">
                <img src="../../StaticResources/Icons/properties.png" alt="属性">
                <span>属性</span>
            </div>
        </div>
    </div>

    <!-- 地址栏 -->
    <div class="address-bar">
        <div class="nav-buttons">
            <button class="nav-button" id="nav-back">◀</button>
            <button class="nav-button" id="nav-forward">▶</button>
            <button class="nav-button" id="nav-up">▲</button>
        </div>
        <div class="address-input-container">
            <img class="address-icon" src="../../StaticResources/Icons/folder.ico" alt="文件夹">
            <input type="text" class="address-input" id="address-input" value="此电脑">
        </div>
        <div class="search-box">
            <img class="search-icon" src="../../StaticResources/Icons/search.png" alt="搜索">
            <input type="text" class="search-input" id="search-input" placeholder="搜索此电脑">
        </div>
        <div class="view-toggle">
            <button id="view-icons" class="active" title="图标">⊞</button>
            <button id="view-list" title="列表">☰</button>
            <button id="view-details" title="详细信息">📋</button>
        </div>
    </div>

    <!-- 主内容区 -->
    <div class="main-content">
        <!-- 导航侧边栏 -->
        <div class="navigation-pane">
            <div class="nav-section">
                <div class="nav-section-title">快速访问</div>
                <div class="nav-item" data-path="quick-access">
                    <img src="../../StaticResources/Icons/100.ico" alt="快速访问">
                    <span>快速访问</span>
                </div>
                <div class="nav-item" data-path="desktop">
                    <img src="../../StaticResources/Icons/desktop.ico" alt="桌面">
                    <span>桌面</span>
                </div>
                <div class="nav-item" data-path="downloads">
                    <img src="../../StaticResources/Icons/downloads.png" alt="下载">
                    <span>下载</span>
                </div>
                <div class="nav-item" data-path="documents">
                    <img src="../../StaticResources/Icons/documents.png" alt="文档">
                    <span>文档</span>
                </div>
                <div class="nav-item" data-path="pictures">
                    <img src="../../StaticResources/Icons/pictures.png" alt="图片">
                    <span>图片</span>
                </div>
                <div class="nav-item" data-path="music">
                    <img src="../../StaticResources/Icons/music.ico" alt="音乐">
                    <span>音乐</span>
                </div>
                <div class="nav-item" data-path="videos">
                    <img src="../../StaticResources/Icons/videos.png" alt="视频">
                    <span>视频</span>
                </div>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">此电脑</div>
                <div class="nav-item active" data-path="this-pc">
                    <img src="../../StaticResources/Icons/shell32_16.ico" alt="此电脑">
                    <span>此电脑</span>
                </div>
                <div class="nav-item" data-path="network">
                    <img src="../../StaticResources/Icons/25.ico" alt="网络">
                    <span>网络</span>
                </div>
            </div>
            <div class="nav-section">
                <div class="nav-section-title">设备和驱动器</div>
                <div class="nav-item" data-path="c-drive">
                    <img src="../../StaticResources/Icons/drive.ico" alt="本地磁盘">
                    <span>本地磁盘 (C:)</span>
                </div>
                <div class="nav-item" data-path="d-drive">
                    <img src="../../StaticResources/Icons/drive.ico" alt="本地磁盘">
                    <span>本地磁盘 (D:)</span>
                </div>
                <div class="nav-item" data-path="dvd-drive">
                    <img src="../../StaticResources/Icons/dvd.ico" alt="DVD驱动器">
                    <span>DVD驱动器 (E:)</span>
                </div>
            </div>
        </div>

        <!-- 文件列表 - 图标视图 -->
        <div class="file-list" id="file-list-icons">
            <div class="file-grid" id="file-grid">
                <!-- 动态生成文件列表 -->
            </div>
        </div>

        <!-- 文件列表 - 列表视图 -->
        <div class="file-list hidden" id="file-list-list">
            <table class="file-list-view" id="file-table">
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>修改日期</th>
                        <th>类型</th>
                        <th>大小</th>
                    </tr>
                </thead>
                <tbody id="file-table-body">
                    <!-- 动态生成文件列表 -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="status-left">
            <span id="item-count">0 个项目</span>
            <span id="selected-count"></span>
        </div>
        <div class="status-right">
            <span id="drive-info"></span>
        </div>
    </div>
    <script src="../../StaticResources/Js/jquery-3.7.1.min.js"></script>
    <script type="module" src="this-pc.js"></script>
</body>

</html>
